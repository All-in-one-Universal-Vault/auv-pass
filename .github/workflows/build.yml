# auv-pass CI: 三平台 × 两架构 = 12 个二进制产物
# 触发: push 到 main 或打 tag
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: auv-pass-tui-windows-x86_64
            package: auv-pass-tui
            ext: .exe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: auv-pass-gui-windows-x86_64
            package: auv-pass-gui
            ext: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: auv-pass-tui-windows-arm64
            package: auv-pass-tui
            ext: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: auv-pass-gui-windows-arm64
            package: auv-pass-gui
            ext: .exe
          # ── Linux ──
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: auv-pass-tui-linux-x86_64
            package: auv-pass-tui
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: auv-pass-tui-linux-arm64
            package: auv-pass-tui
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: auv-pass-gui-linux-x86_64
            package: auv-pass-gui
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: auv-pass-gui-linux-arm64
            package: auv-pass-gui
            ext: ""
          # ── macOS ──
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: auv-pass-tui-macos-arm64
            package: auv-pass-tui
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: auv-pass-gui-macos-arm64
            package: auv-pass-gui
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: auv-pass-tui-macos-x86_64
            package: auv-pass-tui
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: auv-pass-gui-macos-x86_64
            package: auv-pass-gui
            ext: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux GUI: 安装 X11/Wayland 开发头文件
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux' && matrix.package == 'auv-pass-gui'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxrandr-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libegl1-mesa-dev libasound2-dev

      # Linux ARM64: 安装交叉编译工具链(musl + gnu 都需要)
      - name: Install Linux ARM cross-compiler
        if: runner.os == 'Linux' && startsWith(matrix.target, 'aarch64')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config
          mkdir -p .cargo
          echo "[target.${{ matrix.target }}]" >> .cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p ${{ matrix.package }}

      - name: Rename artifact
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.package }}${{ matrix.ext }} \
             ${{ matrix.artifact }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.ext }}

  # 打 tag 时: 把全部产物打包为 Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*-linux-*
            artifacts/**/*-macos-*
